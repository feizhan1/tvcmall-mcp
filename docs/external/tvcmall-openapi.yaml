openapi: 3.1.0
info:
  title: TVCMall Customer MCP HTTP API Example
  version: 0.1.0-example
  description: |
    Example OpenAPI contract for the future real TVCMall HTTP API used by
    the local TVCMall MCP server. Replace paths, fields, and examples with
    the official backend contract before implementing real clients.
servers:
  - url: https://api.tvcmall.com
    description: Production example
  - url: https://sandbox-api.tvcmall.example
    description: Sandbox example
tags:
  - name: Auth
  - name: Products
  - name: Shipping
  - name: Orders
  - name: Tracking
security:
  - bearerAuth: []
paths:
  /user/login:
    post:
      tags: [Auth]
      summary: 登录
      description: |
        Login endpoint from `docs/external/登录.openapi.yaml`. The response
        schema is not specified in the source document, so the HTTP auth
        client accepts common token shapes such as `data.token`,
        `data.access_token`, or top-level equivalents.
      security: []
      operationId: loginForMcp
      parameters:
        - name: Authorization
          in: header
          required: false
          description: Login API authorization header from the source OpenAPI document.
          example: login-api-authorization-example
          schema:
            type: string
            default: login-api-authorization-example
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              default:
                value:
                  email: customer@example.com
                  password: '<password>'
                  rememberme: true
      responses:
        '200':
          description: Login succeeded. Replace this loose schema with the official response schema when available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/mcp/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      security: []
      operationId: refreshMcpToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Refresh succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/AuthFailed'
  /api/mcp/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke current refresh token
      operationId: logoutMcpSession
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Logout succeeded
        '401':
          $ref: '#/components/responses/AuthRequired'
  /api/mcp/auth/me:
    get:
      tags: [Auth]
      summary: Get current customer profile and scopes
      operationId: getMcpAuthMe
      responses:
        '200':
          description: Current authenticated customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMeResponse'
        '401':
          $ref: '#/components/responses/AuthRequired'
  /api/mcp/products/search:
    get:
      tags: [Products]
      summary: Search products
      operationId: searchProducts
      parameters:
        - $ref: '#/components/parameters/ProductQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Product search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductSearchResponse'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/mcp/products/{product_id}:
    get:
      tags: [Products]
      summary: Get product detail
      operationId: getProductDetail
      parameters:
        - name: product_id
          in: path
          required: true
          schema:
            type: string
          example: prd_iphone_case_001
      responses:
        '200':
          description: Product detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/mcp/shipping/estimate:
    post:
      tags: [Shipping]
      summary: Estimate shipping options
      operationId: estimateShipping
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShippingEstimateRequest'
      responses:
        '200':
          description: Shipping estimate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShippingEstimateResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthRequired'
  /api/mcp/orders:
    get:
      tags: [Orders]
      summary: List customer orders
      operationId: listOrders
      parameters:
        - name: start_date
          in: query
          required: false
          schema:
            type: string
            format: date
          example: '2026-06-01'
        - name: end_date
          in: query
          required: false
          schema:
            type: string
            format: date
          example: '2026-06-30'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Orders page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOrdersResponse'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/PermissionDenied'
  /api/mcp/orders/{order_id}:
    get:
      tags: [Orders]
      summary: Get order detail
      operationId: getOrderDetail
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/mcp/orders/{order_id}/tracking:
    get:
      tags: [Tracking]
      summary: Get tracking information for one order
      operationId: getTrackingInfo
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Tracking information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackingInfo'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/mcp/orders/tracking/batch:
    post:
      tags: [Tracking]
      summary: Get tracking information for multiple orders
      operationId: batchGetTracking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchTrackingRequest'
      responses:
        '200':
          description: Batch tracking result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchTrackingResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthRequired'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ProductQuery:
      name: query
      in: query
      required: true
      schema:
        type: string
        minLength: 1
      example: iphone case
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
      example: 20
    OrderId:
      name: order_id
      in: path
      required: true
      schema:
        type: string
      example: V10001
  responses:
    AuthRequired:
      description: Missing, expired, or invalid access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                code: AUTH_REQUIRED
                message: Login is required.
    AuthFailed:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                code: AUTH_FAILED
                message: Invalid username, password, or refresh token.
    PermissionDenied:
      description: Authenticated customer does not have the required scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                code: PERMISSION_DENIED
                message: Missing required scope.
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                code: VALIDATION_ERROR
                message: Request parameters are invalid.
    RateLimited:
      description: Too many requests
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until retry is allowed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                code: RATE_LIMITED
                message: Too many requests.
    NotFound:
      description: Resource not found or not visible to current customer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                code: NOT_FOUND
                message: Resource not found.
  schemas:
    LoginRequest:
      type: object
      required: [email, password, rememberme]
      properties:
        email:
          type: string
          format: email
          example: customer@example.com
        password:
          type: string
          format: password
          example: '<password>'
        rememberme:
          type: boolean
          example: true
      additionalProperties: false
    LoginResponse:
      type: object
      description: Source login OpenAPI currently declares an empty object schema; this placeholder keeps the raw response extensible.
      additionalProperties: true
      example:
        data:
          token: '<access_token>'
          refresh_token: '<refresh_token>'
          expires_in: 7200
          user:
            customer_id: cus_123
            email: customer@example.com
            name: Example Customer
          scopes: [products:read, orders:read]
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
      additionalProperties: false
    LogoutRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
      additionalProperties: false
    AuthSession:
      type: object
      required: [access_token, refresh_token, expires_in, token_type, customer, scopes]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          minimum: 1
          example: 7200
        token_type:
          type: string
          enum: [Bearer]
        customer:
          $ref: '#/components/schemas/CustomerProfile'
        scopes:
          type: array
          items:
            type: string
          example: [products:read, orders:read, tracking:read, orders:export]
    AuthMeResponse:
      type: object
      required: [customer, scopes]
      properties:
        customer:
          $ref: '#/components/schemas/CustomerProfile'
        scopes:
          type: array
          items:
            type: string
    CustomerProfile:
      type: object
      required: [id, email, name]
      properties:
        id:
          type: string
          example: cus_123
        email:
          type: string
          format: email
          example: customer@example.com
        name:
          type: string
          example: Example Customer
    ProductSearchResponse:
      type: object
      required: [query, page, page_size, total, items]
      properties:
        query:
          type: string
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductSummary'
    ProductSummary:
      type: object
      required: [id, sku, title, price, currency, stock_status, category, summary]
      properties:
        id:
          type: string
        sku:
          type: string
        title:
          type: string
        price:
          type: number
        currency:
          type: string
          example: USD
        stock_status:
          type: string
          enum: [in_stock, low_stock, out_of_stock]
        category:
          type: string
        summary:
          type: string
    ProductDetail:
      allOf:
        - $ref: '#/components/schemas/ProductSummary'
        - type: object
          required: [moq, weight_kg, dimensions_cm, attributes, images]
          properties:
            moq:
              type: integer
              minimum: 1
            weight_kg:
              type: number
            dimensions_cm:
              $ref: '#/components/schemas/DimensionsCm'
            attributes:
              type: array
              items:
                $ref: '#/components/schemas/ProductAttribute'
            images:
              type: array
              items:
                type: string
                format: uri
    DimensionsCm:
      type: object
      required: [length, width, height]
      properties:
        length:
          type: number
        width:
          type: number
        height:
          type: number
    ProductAttribute:
      type: object
      required: [name, value]
      properties:
        name:
          type: string
        value:
          type: string
    ShippingEstimateRequest:
      type: object
      required: [destination_country, items]
      properties:
        destination_country:
          type: string
          minLength: 2
          maxLength: 2
          example: US
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [product_id, quantity]
            properties:
              product_id:
                type: string
              quantity:
                type: integer
                minimum: 1
      additionalProperties: false
    ShippingEstimateResponse:
      type: object
      required: [destination_country, chargeable_weight_kg, item_count, options]
      properties:
        destination_country:
          type: string
        chargeable_weight_kg:
          type: number
        item_count:
          type: integer
        options:
          type: array
          items:
            $ref: '#/components/schemas/ShippingOption'
    ShippingOption:
      type: object
      required: [carrier, service, estimated_days, price, currency]
      properties:
        carrier:
          type: string
        service:
          type: string
        estimated_days:
          type: string
          example: 3-5
        price:
          type: number
        currency:
          type: string
          example: USD
    OrderStatus:
      type: string
      enum: [processing, shipped, delivered, canceled]
    ListOrdersResponse:
      type: object
      required: [page, page_size, total, items]
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderSummary'
    OrderSummary:
      type: object
      required: [id, status, created_at, item_count, total_amount, currency]
      properties:
        id:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        created_at:
          type: string
          format: date
        item_count:
          type: integer
        total_amount:
          type: number
        currency:
          type: string
    OrderDetail:
      allOf:
        - $ref: '#/components/schemas/OrderSummary'
        - type: object
          required: [items, shipping_address, totals]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/OrderItem'
            shipping_address:
              $ref: '#/components/schemas/MaskedShippingAddress'
            totals:
              $ref: '#/components/schemas/OrderTotals'
    OrderItem:
      type: object
      required: [product_id, sku, title, quantity, unit_price, currency]
      properties:
        product_id:
          type: string
        sku:
          type: string
        title:
          type: string
        quantity:
          type: integer
        unit_price:
          type: number
        currency:
          type: string
    MaskedShippingAddress:
      type: object
      required: [country, city, masked_postcode]
      description: Address fields must be masked before returning to MCP clients.
      properties:
        country:
          type: string
        city:
          type: string
        masked_postcode:
          type: string
          example: 90***
    OrderTotals:
      type: object
      required: [subtotal, shipping, grand_total, currency]
      properties:
        subtotal:
          type: number
        shipping:
          type: number
        grand_total:
          type: number
        currency:
          type: string
    TrackingInfo:
      type: object
      required: [order_id, carrier, tracking_number, status, events]
      properties:
        order_id:
          type: string
        carrier:
          type: string
        tracking_number:
          type: string
        status:
          type: string
          enum: [label_created, in_transit, delivered, exception]
        events:
          type: array
          items:
            $ref: '#/components/schemas/TrackingEvent'
    TrackingEvent:
      type: object
      required: [time, location, status]
      properties:
        time:
          type: string
          format: date-time
        location:
          type: string
        status:
          type: string
    BatchTrackingRequest:
      type: object
      required: [order_ids]
      properties:
        order_ids:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
      additionalProperties: false
    BatchTrackingResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TrackingInfo'
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - AUTH_REQUIRED
            - AUTH_FAILED
            - TOKEN_EXPIRED
            - PERMISSION_DENIED
            - RATE_LIMITED
            - VALIDATION_ERROR
            - API_UNAVAILABLE
            - NOT_FOUND
        message:
          type: string
        details:
          type: object
          additionalProperties: true
